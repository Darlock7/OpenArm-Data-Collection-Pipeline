<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="940" height="560" role="img" aria-label="OpenArm 2.0 bimanual rig: 7 joints per arm on two CAN FD buses, with four cameras">

  <!-- ===================== title ===================== -->
  <text x="470" y="34" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" font-weight="700" fill="#8b98a9">OpenArm 2.0 — data collection rig</text>
  <text x="470" y="55" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#7d8896">14 joints · 2 CAN FD buses @ 5 Mbit/s · 4 cameras</text>

  <!-- ===================== ceiling camera ===================== -->
  <g>
    <rect x="432" y="80" width="76" height="30" rx="5" fill="none" stroke="#9b7ede" stroke-width="2"/>
    <circle cx="470" cy="95" r="8" fill="none" stroke="#9b7ede" stroke-width="2"/>
    <circle cx="470" cy="95" r="3" fill="#9b7ede"/>
    <line x1="470" y1="110" x2="470" y2="150" stroke="#9b7ede" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="520" y="93" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#9b7ede">ceiling</text>
    <text x="520" y="107" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#7d8896">15 fps · 1280x720</text>
  </g>

  <!-- ===================== ZED head ===================== -->
  <g>
    <rect x="428" y="152" width="84" height="26" rx="4" fill="none" stroke="#9b7ede" stroke-width="2"/>
    <circle cx="446" cy="165" r="6" fill="none" stroke="#9b7ede" stroke-width="1.8"/>
    <circle cx="494" cy="165" r="6" fill="none" stroke="#9b7ede" stroke-width="1.8"/>
    <text x="524" y="163" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#9b7ede">zed_head</text>
    <text x="524" y="177" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#7d8896">stereo · 60 fps · primary</text>
  </g>

  <!-- ===================== torso + base ===================== -->
  <rect x="452" y="178" width="36" height="242" rx="4" fill="none" stroke="#7a8699" stroke-width="2.5"/>
  <rect x="352" y="420" width="236" height="26" rx="3" fill="none" stroke="#7a8699" stroke-width="2.5"/>
  <line x1="352" y1="433" x2="588" y2="433" stroke="#7a8699" stroke-width="1" stroke-dasharray="3 5"/>
  <text x="470" y="464" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#7d8896">MISUMI-frame base</text>

  <!-- ===================== LEFT ARM (can0) ===================== -->
  <polyline points="452,212 400,232 358,262 310,306 272,350 242,388 218,414"
            fill="none" stroke="#7a8699" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- shoulder cluster: 8009P -->
  <circle cx="452" cy="212" r="10" fill="none" stroke="#e07a5f" stroke-width="3"/>
  <circle cx="400" cy="232" r="10" fill="none" stroke="#e07a5f" stroke-width="3"/>
  <circle cx="358" cy="262" r="10" fill="none" stroke="#e07a5f" stroke-width="3"/>
  <!-- elbow + wrist: 43-series -->
  <circle cx="310" cy="306" r="8" fill="none" stroke="#4a9d9c" stroke-width="2.5"/>
  <circle cx="272" cy="350" r="8" fill="none" stroke="#4a9d9c" stroke-width="2.5"/>
  <circle cx="242" cy="388" r="8" fill="none" stroke="#4a9d9c" stroke-width="2.5"/>
  <circle cx="218" cy="414" r="8" fill="none" stroke="#4a9d9c" stroke-width="2.5"/>
  <!-- wrist cam -->
  <rect x="176" y="424" width="30" height="20" rx="3" fill="none" stroke="#9b7ede" stroke-width="1.8"/>
  <circle cx="191" cy="434" r="4.5" fill="none" stroke="#9b7ede" stroke-width="1.5"/>
  <text x="150" y="466" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#9b7ede">wrist_left · 30 fps</text>
  <!-- joint labels -->
  <text x="432" y="200" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#7d8896">j1</text>
  <text x="386" y="222" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#7d8896">j2</text>
  <text x="344" y="252" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#7d8896">j3</text>
  <text x="296" y="298" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#7d8896">j4</text>
  <text x="258" y="342" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#7d8896">j5</text>
  <text x="228" y="380" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#7d8896">j6</text>
  <text x="204" y="406" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#7d8896">j7</text>

  <!-- ===================== RIGHT ARM (can1) ===================== -->
  <polyline points="488,212 540,232 582,262 630,306 668,350 698,388 722,414"
            fill="none" stroke="#7a8699" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="488" cy="212" r="10" fill="none" stroke="#e07a5f" stroke-width="3"/>
  <circle cx="540" cy="232" r="10" fill="none" stroke="#e07a5f" stroke-width="3"/>
  <circle cx="582" cy="262" r="10" fill="none" stroke="#e07a5f" stroke-width="3"/>
  <circle cx="630" cy="306" r="8" fill="none" stroke="#4a9d9c" stroke-width="2.5"/>
  <circle cx="668" cy="350" r="8" fill="none" stroke="#4a9d9c" stroke-width="2.5"/>
  <circle cx="698" cy="388" r="8" fill="none" stroke="#4a9d9c" stroke-width="2.5"/>
  <circle cx="722" cy="414" r="8" fill="none" stroke="#4a9d9c" stroke-width="2.5"/>
  <rect x="734" y="424" width="30" height="20" rx="3" fill="none" stroke="#9b7ede" stroke-width="1.8"/>
  <circle cx="749" cy="434" r="4.5" fill="none" stroke="#9b7ede" stroke-width="1.5"/>
  <text x="734" y="466" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#9b7ede">wrist_right · 30 fps</text>
  <text x="508" y="200" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#7d8896">j1</text>
  <text x="554" y="222" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#7d8896">j2</text>
  <text x="596" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#7d8896">j3</text>
  <text x="644" y="298" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#7d8896">j4</text>
  <text x="682" y="342" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#7d8896">j5</text>
  <text x="712" y="380" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#7d8896">j6</text>
  <text x="736" y="406" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#7d8896">j7</text>

  <!-- ===================== host + CAN buses ===================== -->
  <rect x="384" y="492" width="172" height="44" rx="5" fill="none" stroke="#7a8699" stroke-width="2"/>
  <text x="470" y="512" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#8b98a9">host PC</text>
  <text x="470" y="527" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#7d8896">SocketCAN · this repo</text>

  <!-- can0 -->
  <path d="M 384 514 L 300 514 L 300 470 L 452 470 L 452 222" fill="none" stroke="#d4a017" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="256" y="510" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#d4a017">can0</text>
  <text x="222" y="524" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#7d8896">left arm · 7 motors</text>
  <!-- can1 -->
  <path d="M 556 514 L 640 514 L 640 470 L 488 470 L 488 222" fill="none" stroke="#6c8ebf" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="652" y="510" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#6c8ebf">can1</text>
  <text x="652" y="524" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#7d8896">right arm · 7 motors</text>

  <!-- ===================== legend ===================== -->
  <g transform="translate(786,150)">
    <circle cx="8" cy="0" r="8" fill="none" stroke="#e07a5f" stroke-width="3"/>
    <text x="24" y="4" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#7d8896">DM 8009P</text>
    <text x="24" y="17" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9" fill="#7d8896">shoulder x3</text>

    <circle cx="8" cy="44" r="7" fill="none" stroke="#4a9d9c" stroke-width="2.5"/>
    <text x="24" y="48" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#7d8896">DM 43-series</text>
    <text x="24" y="61" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9" fill="#7d8896">elbow + wrist x4</text>

    <rect x="1" y="82" width="15" height="11" rx="2" fill="none" stroke="#9b7ede" stroke-width="1.8"/>
    <text x="24" y="92" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#7d8896">camera</text>

    <line x1="0" y1="118" x2="16" y2="118" stroke="#d4a017" stroke-width="2" stroke-dasharray="6 3"/>
    <text x="24" y="122" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#7d8896">CAN FD bus</text>
  </g>

  <!-- ===================== footnote ===================== -->
  <text x="470" y="552" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9" fill="#6e7681">Schematic, not to scale. Motor-to-joint assignment is assumed — see config.py.</text>
</svg>
